[workspace]
resolver = "2"
members = ["crates/kaseta-contracts", "crates/kasetad"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "Apache-2.0"
repository = "https://github.com/agonk/kaseta"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ulid = { version = "1", features = ["serde"] }
time = { version = "0.3", features = ["formatting", "parsing", "serde", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "process", "signal", "time"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The audio codecs and hashes are built optimised even in debug and test
# builds. They do all the per-sample work, and unoptimised they run slower
# than real time, which makes the tests that push minutes of audio through the
# exports take longer than the audio itself. Only these crates, so a first
# debug build does not pay to optimise the whole HTTP and TLS stack as well.
[profile.dev.package.flacenc]
opt-level = 3

[profile.dev.package.claxon]
opt-level = 3

[profile.dev.package.md-5]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3
