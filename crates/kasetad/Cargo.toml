[package]
name = "kasetad"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Kaseta recording daemon: capture, storage, job pipeline, and local API"

[dependencies]
kaseta-contracts = { path = "../kaseta-contracts" }

anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
ulid.workspace = true
time.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true

# Local API surface. The UI is a static SPA served by this same daemon, so there
# is no second process resident when the interface is open.
axum = "0.8"
tower-http = { version = "0.6", features = ["fs", "trace"] }

# Single-writer embedded database. `bundled` avoids depending on the host's
# libsqlite3 version.
rusqlite = { version = "0.32", features = ["bundled", "time"] }

sha2 = "0.10"
hex = "0.4"
flacenc = { version = "0.5.1", default-features = false, features = ["log"] }
pipewire = { version = "0.10.0", features = ["v0_3_44"] }
claxon = "0.4.3"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "blocking", "rustls"] }
hmac = "0.12"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
