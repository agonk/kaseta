<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kaseta</title>
<style>
  /* One file, no build step, no framework. The page is compiled into the
     daemon binary, so there is nothing to install or serve alongside it. */
  :root {
    color-scheme: light dark;
    --bg: #fbfbfa;
    --panel: #ffffff;
    --line: #e4e4e1;
    --text: #1a1a18;
    --muted: #6b6b66;
    --accent: #b4341f;
    --accent-soft: #fdf0ee;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16161a;
      --panel: #1e1e23;
      --line: #2e2e35;
      --text: #ececf0;
      --muted: #9a9aa4;
      --accent: #e8624a;
      --accent-soft: #2a1d1b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 720px; margin: 0 auto; padding: 32px 20px 80px; }
  h1 { font-size: 19px; margin: 0; letter-spacing: -0.01em; }
  header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 24px; }
  header span { color: var(--muted); font-size: 13px; }

  .recorder {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 20px; margin-bottom: 28px;
    display: flex; align-items: center; gap: 16px;
  }
  .recorder.live { border-color: var(--accent); background: var(--accent-soft); }

  button {
    font: inherit; font-weight: 550; cursor: pointer;
    border-radius: 8px; border: 1px solid var(--line);
    background: var(--panel); color: var(--text); padding: 9px 16px;
  }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover:not(:disabled) { filter: brightness(1.08); }

  .dot {
    width: 9px; height: 9px; border-radius: 50%; background: var(--accent);
    display: inline-block; animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: .25; } }
  @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }

  .elapsed { font-variant-numeric: tabular-nums; font-size: 22px; font-weight: 600; }
  .state { color: var(--muted); font-size: 13px; }

  ul { list-style: none; padding: 0; margin: 0; }
  li {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px;
  }
  .row { display: flex; align-items: center; gap: 12px; }
  .title { font-weight: 550; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { color: var(--muted); font-size: 13px; margin-top: 2px; }
  audio { width: 100%; margin-top: 12px; height: 34px; }

  .icon {
    padding: 5px 9px; font-size: 13px; color: var(--muted);
    background: none; border: none;
  }
  .icon:hover { color: var(--text); background: var(--bg); }

  .tracks { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
  .tracks button { font-size: 12px; padding: 4px 10px; color: var(--muted); }

  .transcript {
    margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line);
    max-height: 340px; overflow-y: auto;
  }
  .line {
    display: grid; grid-template-columns: 52px 54px 1fr; gap: 10px;
    padding: 3px 6px; border-radius: 6px; cursor: pointer; align-items: baseline;
  }
  .line:hover { background: var(--bg); }
  .line time { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .line .who { font-size: 12px; font-weight: 600; }
  .line.you .who { color: var(--accent); }
  .line.them .who { color: var(--muted); }
  .line mark { background: var(--accent-soft); color: inherit; font-weight: 600; }

  .summary {
    margin-top: 12px; padding: 12px 14px; border-radius: 8px;
    background: var(--bg); border: 1px solid var(--line);
  }
  .summary h4 {
    margin: 12px 0 4px; font-size: 12px; text-transform: uppercase;
    letter-spacing: .05em; color: var(--muted);
  }
  .summary h4:first-child { margin-top: 0; }
  .summary p { margin: 0; }
  .summary ul { list-style: disc; padding-left: 18px; }
  .summary li { background: none; border: none; padding: 1px 0; margin: 0; border-radius: 0; }
  .owner { color: var(--muted); font-size: 12px; }

  dialog {
    border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--panel); color: var(--text); padding: 0;
    max-width: 520px; width: calc(100% - 32px);
  }
  dialog::backdrop { background: rgba(0,0,0,.4); }
  .sheet { padding: 22px 24px; }
  .sheet h2 { margin: 0 0 4px; font-size: 17px; }
  .sheet h3 {
    margin: 22px 0 8px; font-size: 12px; text-transform: uppercase;
    letter-spacing: .05em; color: var(--muted);
  }
  .sheet label { display: block; margin-bottom: 10px; font-size: 13px; }
  .sheet label span { display: block; color: var(--muted); margin-bottom: 3px; }
  .sheet input[type=text], .sheet input[type=password] {
    width: 100%; padding: 7px 10px; border-radius: 7px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text);
    font: inherit;
  }
  .check { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .check input { margin: 0; }
  .check span { display: inline; color: var(--text); }
  .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 22px; }
  .note { color: var(--muted); font-size: 12px; margin: 4px 0 0; }
  .set { color: var(--accent); font-size: 12px; }

  .search { display: flex; gap: 8px; margin-bottom: 16px; }
  .search input { flex: 1; border-color: var(--line); }
  .badge {
    font-size: 11px; color: var(--muted); border: 1px solid var(--line);
    border-radius: 999px; padding: 1px 8px; white-space: nowrap;
  }

  .empty, .error {
    color: var(--muted); text-align: center; padding: 36px 20px;
    border: 1px dashed var(--line); border-radius: var(--radius);
  }
  .error { color: var(--accent); border-color: var(--accent); text-align: left; padding: 14px 16px; }
  .warn { color: var(--accent); font-size: 13px; margin-top: 6px; }
  input[type=text] {
    font: inherit; flex: 1; padding: 7px 10px; border-radius: 8px;
    border: 1px solid var(--accent); background: var(--bg); color: var(--text);
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Kaseta</h1>
    <span id="sub">meeting recorder</span>
    <button class="icon" id="open-settings" style="margin-left:auto">Settings</button>
  </header>

  <dialog id="settings">
    <form class="sheet" method="dialog">
      <h2>Settings</h2>

      <h3>Summaries</h3>
      <label class="check">
        <input type="checkbox" id="sum-enabled">
        <span>Summarise meetings after transcribing</span>
      </label>
      <label>
        <span>OpenRouter API key <em id="sum-key-state" class="set"></em></span>
        <input type="password" id="sum-key" placeholder="sk-or-…" autocomplete="off">
      </label>
      <label>
        <span>Model</span>
        <input type="text" id="sum-model" placeholder="anthropic/claude-3.5-haiku">
      </label>
      <p class="note" id="sum-note"></p>

      <h3>Cloud backup</h3>
      <label class="check">
        <input type="checkbox" id="r2-enabled">
        <span>Copy recordings to S3-compatible storage</span>
      </label>
      <label>
        <span>Endpoint <em class="note">blank for Amazon S3</em></span>
        <input type="text" id="r2-endpoint" placeholder="https://ACCOUNT.r2.cloudflarestorage.com">
      </label>
      <label>
        <span>Bucket</span>
        <input type="text" id="r2-bucket" placeholder="meetings">
      </label>
      <label>
        <span>Region</span>
        <input type="text" id="r2-region" placeholder="auto">
      </label>
      <label>
        <span>Access key ID</span>
        <input type="text" id="r2-access" autocomplete="off">
      </label>
      <label>
        <span>Secret access key <em id="r2-secret-state" class="set"></em></span>
        <input type="password" id="r2-secret" autocomplete="off">
      </label>
      <label class="check">
        <input type="checkbox" id="r2-delete">
        <span>Delete local audio once uploaded</span>
      </label>
      <p class="note">Uploading is not implemented yet; these are saved for when it is.</p>

      <div class="actions">
        <button type="button" id="settings-cancel">Cancel</button>
        <button type="button" class="primary" id="settings-save">Save</button>
      </div>
    </form>
  </dialog>

  <div class="recorder" id="recorder">
    <div style="flex:1">
      <div class="elapsed" id="elapsed">Ready</div>
      <div class="state" id="state">Records your microphone and everything you hear, as separate tracks.</div>
      <div class="warn" id="warn" hidden></div>
    </div>
    <button class="primary" id="toggle">Start recording</button>
  </div>

  <div class="search">
    <input type="text" id="q" placeholder="Search everything that was said…" autocomplete="off">
    <button id="clear" hidden>Clear</button>
  </div>

  <div id="error" class="error" hidden></div>
  <ul id="list"></ul>
  <div id="empty" class="empty" hidden>No recordings yet.</div>
</main>

<script>
// Minted per daemon run and substituted into this page when it is served. A
// page on another origin cannot read it, which is what stops a hostile site
// from driving the recorder.
const TOKEN = "__KASETA_TOKEN__";

const $ = (id) => document.getElementById(id);
let state = { state: "idle" };
let busy = false;

const fmtDuration = (ms) => {
  const s = Math.floor(ms / 1000);
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  return h ? `${h}:${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`
           : `${m}:${String(sec).padStart(2,"0")}`;
};

const fmtDate = (iso) => new Date(iso).toLocaleString(undefined, {
  weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit",
});

async function api(path, options = {}) {
  const res = await fetch(path, {
    ...options,
    headers: {
      "content-type": "application/json",
      "x-kaseta-token": TOKEN,
      ...(options.headers || {}),
    },
  });
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.error || `${res.status} ${res.statusText}`);
  }
  return res.status === 204 ? null : res.json();
}

function showError(e) {
  $("error").textContent = e.message;
  $("error").hidden = false;
}

function renderStatus(s) {
  state = s;
  const live = s.state === "recording";
  const finalizing = s.state === "finalizing";

  $("recorder").classList.toggle("live", live);
  $("toggle").textContent = live ? "Stop recording" : "Start recording";
  $("toggle").disabled = finalizing || busy;

  if (live) {
    $("elapsed").innerHTML = `<span class="dot"></span> ${fmtDuration(s.elapsed_s * 1000)}`;
    $("state").textContent = "Recording you and everyone else.";
  } else if (finalizing) {
    $("elapsed").textContent = "Saving…";
    $("state").textContent = "Sealing the recording and preparing audio.";
  } else {
    $("elapsed").textContent = "Ready";
    $("state").textContent = "Records your microphone and everything you hear, as separate tracks.";
  }

  // A recording can be materially broken while still appearing to run, so a
  // track that stopped early is surfaced rather than discovered afterwards.
  const problems = [];
  if (s.failure) problems.push(s.failure);
  // A device coming back is different from one that is gone: the first is
  // temporary and recovering, the second means that side is lost from here on.
  for (const t of s.reconnecting || []) problems.push(`${t} — device lost, reconnecting…`);
  for (const t of s.degraded_tracks || []) problems.push(`${t} stopped capturing`);
  $("warn").hidden = problems.length === 0;
  $("warn").textContent = problems.join(" · ");
}

function renderList(items) {
  $("empty").hidden = items.length > 0;
  $("list").replaceChildren(...items.map(render));
}

function render(item) {
  const li = document.createElement("li");
  li.dataset.id = item.id;

  const row = document.createElement("div");
  row.className = "row";

  const info = document.createElement("div");
  info.style.flex = "1";
  info.style.minWidth = "0";

  const title = document.createElement("div");
  title.className = "title";
  title.textContent = item.title;

  const meta = document.createElement("div");
  meta.className = "meta";
  meta.textContent = `${fmtDate(item.started_at)} · ${fmtDuration(item.duration_ms)}`;

  info.append(title, meta);

  const rename = document.createElement("button");
  rename.className = "icon";
  rename.textContent = "Rename";
  rename.onclick = () => startRename(li, item);

  const remove = document.createElement("button");
  remove.className = "icon";
  remove.textContent = "Delete";
  remove.onclick = () => destroy(item);

  row.append(info, rename, remove);
  li.append(row);

  if (item.has_transcript) {
    const summary = document.createElement("button");
    summary.className = "icon";
    summary.textContent = "Summary";
    summary.onclick = () => toggleSummary(li, item, summary);
    row.insertBefore(summary, rename);

    const show = document.createElement("button");
    show.className = "icon";
    show.textContent = "Transcript";
    show.onclick = () => toggleTranscript(li, item, show);
    row.insertBefore(show, rename);
  }

  if (item.mixed_audio_url) {
    const audio = document.createElement("audio");
    audio.controls = true;
    audio.preload = "none";
    audio.src = item.mixed_audio_url;
    li.append(audio);
  }

  // Both sides are kept separately; the mix is what you usually want, but each
  // side alone is what makes attribution possible.
  if (item.tracks?.length) {
    const tracks = document.createElement("div");
    tracks.className = "tracks";
    for (const t of item.tracks) {
      const b = document.createElement("button");
      b.textContent = `▸ ${t.label} only`;
      b.onclick = () => {
        const a = li.querySelector("audio");
        if (a) { a.src = t.audio_url; a.play(); }
      };
      tracks.append(b);
    }
    li.append(tracks);
  }

  return li;
}

async function toggleSummary(li, item, button) {
  const existing = li.querySelector(".summary");
  if (existing) {
    existing.remove();
    button.textContent = "Summary";
    return;
  }

  const box = document.createElement("div");
  box.className = "summary";
  li.append(box);
  button.textContent = "Hide";

  try {
    const s = await api(`/api/v1/recordings/${item.id}/summary`);

    const section = (title, build) => {
      const h = document.createElement("h4");
      h.textContent = title;
      box.append(h, build());
    };

    if (s.overview) {
      section("Overview", () => {
        const p = document.createElement("p");
        p.textContent = s.overview;
        return p;
      });
    }

    const bullets = (items, render) => () => {
      const ul = document.createElement("ul");
      for (const item of items) ul.append(render(item));
      return ul;
    };

    if (s.decisions?.length) {
      section("Decisions", bullets(s.decisions, (d) => {
        const li = document.createElement("li");
        li.textContent = d;
        return li;
      }));
    }

    if (s.action_items?.length) {
      section("Action items", bullets(s.action_items, (a) => {
        const li = document.createElement("li");
        li.textContent = a.what;
        // An unowned action is shown as such rather than silently attributed.
        const owner = document.createElement("span");
        owner.className = "owner";
        owner.textContent = a.owner ? `  — ${a.owner}` : "  — unassigned";
        li.append(owner);
        return li;
      }));
    }

    if (s.topics?.length) {
      section("Topics", bullets(s.topics, (t) => {
        const li = document.createElement("li");
        li.textContent = t;
        return li;
      }));
    }

    if (!box.childElementCount) {
      box.textContent = "The summary came back empty.";
      box.style.color = "var(--muted)";
    }
  } catch (e) {
    box.textContent = e.message.includes("not been summarised")
      ? "Not summarised yet. Summaries need KASETA_OPENROUTER_KEY to be set."
      : e.message;
    box.style.color = "var(--muted)";
  }
}

async function toggleTranscript(li, item, button) {
  const existing = li.querySelector(".transcript");
  if (existing) {
    existing.remove();
    button.textContent = "Transcript";
    return;
  }

  try {
    const data = await api(`/api/v1/recordings/${item.id}/transcript`);
    const box = document.createElement("div");
    box.className = "transcript";

    for (const line of data.lines) {
      const el = document.createElement("div");
      el.className = `line ${line.speaker}`;

      const at = document.createElement("time");
      at.textContent = fmtDuration(line.at_s * 1000);

      const who = document.createElement("span");
      who.className = "who";
      who.textContent = line.speaker === "you" ? "You" : line.speaker === "them" ? "Them" : "";

      const text = document.createElement("span");
      // textContent, not innerHTML: a transcript is untrusted text and may
      // contain anything that was said or misheard.
      text.textContent = line.text;
      if (lastQuery) highlight(text, lastQuery);

      // Clicking a line seeks the player to that moment, which is the point of
      // keeping timestamps through the whole pipeline.
      el.onclick = () => {
        const audio = li.querySelector("audio");
        if (!audio) return;
        audio.currentTime = line.at_s;
        audio.play();
      };

      el.append(at, who, text);
      box.append(el);
    }

    if (!data.lines.length) {
      box.textContent = "No speech was found in this recording.";
      box.style.color = "var(--muted)";
    }

    li.append(box);
    button.textContent = "Hide";
  } catch (e) { showError(e); }
}

/// Wraps matches of `query` so a search result shows why it matched.
function highlight(el, query) {
  const text = el.textContent;
  const at = text.toLowerCase().indexOf(query.toLowerCase());
  if (at < 0) return;

  el.textContent = "";
  el.append(
    document.createTextNode(text.slice(0, at)),
    Object.assign(document.createElement("mark"), {
      textContent: text.slice(at, at + query.length),
    }),
    document.createTextNode(text.slice(at + query.length)),
  );
}

function startRename(li, item) {
  const row = li.querySelector(".row");
  const input = document.createElement("input");
  input.type = "text";
  input.value = item.title;

  const save = async () => {
    const title = input.value.trim();
    try {
      await api(`/api/v1/recordings/${item.id}`, {
        method: "PATCH",
        body: JSON.stringify({ title: title || null }),
      });
      await refreshList();
    } catch (e) { showError(e); }
  };

  input.onkeydown = (e) => {
    if (e.key === "Enter") save();
    if (e.key === "Escape") refreshList();
  };
  input.onblur = save;

  row.replaceChildren(input);
  input.focus();
  input.select();
}

async function destroy(item) {
  if (!confirm(`Delete "${item.title}"? The audio is removed permanently.`)) return;
  try {
    await api(`/api/v1/recordings/${item.id}`, { method: "DELETE" });
    await refreshList();
  } catch (e) { showError(e); }
}

$("toggle").onclick = async () => {
  busy = true;
  $("toggle").disabled = true;
  $("error").hidden = true;
  try {
    if (state.state === "recording") {
      await api("/api/v1/recordings/active/stop", { method: "POST" });
      await refreshList();
    } else {
      await api("/api/v1/recordings", { method: "POST", body: JSON.stringify({}) });
    }
  } catch (e) {
    showError(e);
  } finally {
    busy = false;
    await refreshStatus();
  }
};

async function refreshStatus() {
  try { renderStatus(await api("/api/v1/status")); }
  catch (e) { showError(e); }
}

let lastQuery = "";
let searchTimer = null;

async function refreshList() {
  try {
    const path = lastQuery
      ? `/api/v1/search?q=${encodeURIComponent(lastQuery)}`
      : "/api/v1/recordings";
    const { items } = await api(path);
    renderList(items);
    $("empty").textContent = lastQuery
      ? `Nothing matching "${lastQuery}".`
      : "No recordings yet.";
  } catch (e) { showError(e); }
}

$("q").oninput = (e) => {
  // Debounced: searching on every keystroke would query the index far faster
  // than anyone types meaningfully.
  clearTimeout(searchTimer);
  lastQuery = e.target.value.trim();
  $("clear").hidden = !lastQuery;
  searchTimer = setTimeout(refreshList, 200);
};

$("clear").onclick = () => {
  $("q").value = "";
  lastQuery = "";
  $("clear").hidden = true;
  refreshList();
};

// --- settings -------------------------------------------------------------

const dialog = $("settings");

$("open-settings").onclick = async () => {
  try {
    const s = await api("/api/v1/settings");

    $("sum-enabled").checked = s.summaries.enabled;
    $("sum-model").value = s.summaries.model || "";
    // A saved secret is never sent back, so the field starts empty and its
    // placeholder says whether one exists.
    $("sum-key").value = "";
    $("sum-key").placeholder = s.summaries.api_key_set
      ? `saved ${s.summaries.api_key_hint || ""}`
      : "sk-or-…";
    $("sum-key-state").textContent = s.summaries.api_key_set ? "saved" : "";
    $("sum-note").textContent = s.summaries.from_environment
      ? "A key is set in the environment and takes precedence over this one."
      : "Without a key, meetings are still recorded and transcribed.";

    $("r2-enabled").checked = s.remote_storage.enabled;
    $("r2-endpoint").value = s.remote_storage.endpoint;
    $("r2-bucket").value = s.remote_storage.bucket;
    $("r2-region").value = s.remote_storage.region;
    $("r2-access").value = s.remote_storage.access_key_id;
    $("r2-secret").value = "";
    $("r2-secret").placeholder = s.remote_storage.secret_set ? "saved" : "";
    $("r2-secret-state").textContent = s.remote_storage.secret_set ? "saved" : "";
    $("r2-delete").checked = s.remote_storage.delete_local_after_upload;

    dialog.showModal();
  } catch (e) { showError(e); }
};

$("settings-cancel").onclick = () => dialog.close();

$("settings-save").onclick = async () => {
  // A blank secret field means "leave it alone", so it is omitted entirely
  // rather than sent as an empty string — which would clear the stored key.
  const body = {
    summaries_enabled: $("sum-enabled").checked,
    summaries_model: $("sum-model").value,
    remote_enabled: $("r2-enabled").checked,
    remote_endpoint: $("r2-endpoint").value,
    remote_bucket: $("r2-bucket").value,
    remote_region: $("r2-region").value,
    remote_access_key_id: $("r2-access").value,
    remote_delete_local: $("r2-delete").checked,
  };
  if ($("sum-key").value) body.summaries_api_key = $("sum-key").value;
  if ($("r2-secret").value) body.remote_secret_access_key = $("r2-secret").value;

  try {
    await api("/api/v1/settings", { method: "PUT", body: JSON.stringify(body) });
    dialog.close();
  } catch (e) { showError(e); }
};

refreshStatus();
refreshList();
// Polling rather than a socket: the page is open occasionally and briefly, and
// a second of latency on an elapsed counter costs nothing.
setInterval(refreshStatus, 1000);
</script>
</body>
</html>
